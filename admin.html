<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Backoffice — Armenia Along the Way</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@500;600;700&family=DM+Sans:opsz,wght@9..40,400;500;600;700&family=Noto+Sans+Armenian:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F5F3EF; --card:#FFFFFF; --ink:#1B1D3A; --muted:#5E6180; --faint:#8D90A8; --line:#E4E1DA;
  --navy:#1F2250; --accent:#FFB36B; --accent-ink:#8A3F00; --ok:#1F8A4C; --bad:#B3341A; --blue:#3E6FA8;
  --rose:#E0764A; --surface-2:#F1EEE8; --border-strong:#D5D1C8;
  --font-display:'Sora','Noto Sans Armenian',system-ui,sans-serif;
  --font-body:'DM Sans','Noto Sans Armenian',system-ui,sans-serif;
}
*{ box-sizing:border-box; }
html,body{ margin:0; background:var(--bg); color:var(--ink); font:400 15px/1.5 var(--font-body); }
button,input,textarea,select{ font:inherit; color:inherit; }
a{ color:var(--accent-ink); }
.top{ background:var(--navy); color:#fff; padding:14px 22px; display:flex; align-items:center; gap:16px; flex-wrap:wrap; }
.top h1{ margin:0; font:700 18px var(--font-display); letter-spacing:.01em; }
.top .sp{ flex:1; }
.top .who{ font-size:13px; color:#CFD0E8; }
.top a,.top button{ color:#fff; }
.wrap{ max-width:1080px; margin:0 auto; padding:22px 18px 80px; }
.tabs{ display:flex; gap:6px; margin-bottom:18px; flex-wrap:wrap; }
.tab{ border:1px solid var(--line); background:var(--card); padding:10px 18px; border-radius:999px; cursor:pointer; font-weight:600; }
.tab.on{ background:var(--navy); color:#fff; border-color:var(--navy); }
.card{ background:var(--card); border:1px solid var(--line); border-radius:18px; padding:20px; }
.center{ max-width:420px; margin:9vh auto 0; text-align:center; display:flex; flex-direction:column; gap:12px; }
.center h2{ margin:0; font:700 22px var(--font-display); }
.center p{ margin:0; color:var(--muted); }
.btn{ border:1px solid var(--border-strong); background:#fff; padding:10px 16px; border-radius:12px; cursor:pointer; font-weight:600; }
.btn:hover{ background:var(--surface-2); }
.btn.primary{ background:var(--navy); border-color:var(--navy); color:#fff; }
.btn.primary:hover{ background:#2b2f6b; }
.btn.danger{ color:var(--bad); border-color:#E7C1B8; }
.btn.small{ padding:6px 12px; font-size:13px; border-radius:10px; }
.btn:disabled{ opacity:.5; cursor:default; }
.input{ width:100%; padding:11px 13px; border:1px solid var(--border-strong); border-radius:12px; background:#fff; }
textarea.input{ min-height:96px; resize:vertical; line-height:1.45; }
.row2{ display:flex; gap:8px; }
.msg{ font-size:13px; color:var(--muted); min-height:18px; }
.msg.err{ color:var(--bad); }
.or{ display:flex; align-items:center; gap:10px; color:var(--faint); font-size:12px; }
.or::before,.or::after{ content:''; flex:1; height:1px; background:var(--line); }
.tools{ display:flex; gap:10px; margin-bottom:14px; flex-wrap:wrap; align-items:center; }
.tools .input{ max-width:340px; }
.seg{ display:inline-flex; border:1px solid var(--line); border-radius:999px; overflow:hidden; background:#fff; }
.seg button{ border:0; background:transparent; padding:8px 14px; cursor:pointer; font-weight:600; color:var(--muted); }
.seg button.on{ background:var(--navy); color:#fff; }
.count{ color:var(--muted); font-size:13px; margin-left:auto; }

.plist{ display:flex; flex-direction:column; gap:10px; }
.place{ background:var(--card); border:1px solid var(--line); border-radius:16px; overflow:hidden; }
.place.hid{ opacity:.65; }
.prow{ display:flex; align-items:center; gap:14px; padding:12px 14px; cursor:pointer; }
.prow:hover{ background:#FBFAF7; }
.ico{ flex:none; width:52px; height:52px; }
.ico svg{ width:100%; height:100%; display:block; }
.pmain{ flex:1; min-width:0; }
.pname{ font-weight:700; }
.pmeta{ font-size:13px; color:var(--muted); }
.chips{ display:flex; gap:6px; flex-wrap:wrap; margin-top:4px; }
.chip{ font-size:12px; padding:2px 9px; border-radius:999px; background:var(--surface-2); color:var(--muted); }
.badge{ font-size:11.5px; font-weight:700; padding:3px 9px; border-radius:999px; }
.badge.ed{ background:#FFF0DC; color:var(--accent-ink); }
.badge.hd{ background:#F9DDD7; color:var(--bad); }
.editor{ border-top:1px solid var(--line); padding:18px; background:#FBFAF7; display:grid; gap:16px; }
.grid2{ display:grid; grid-template-columns:1fr 1fr; gap:14px; }
@media (max-width:720px){ .grid2{ grid-template-columns:1fr; } .prow{ flex-wrap:wrap; } }
.lbl{ display:block; font-weight:700; font-size:13px; margin-bottom:5px; }
.hint{ font-size:12.5px; color:var(--faint); margin-top:4px; }
.icons{ display:grid; grid-template-columns:repeat(auto-fill,minmax(64px,1fr)); gap:8px; }
.icons label{ cursor:pointer; position:relative; }
.icons input{ position:absolute; opacity:0; }
.icons .ib{ display:block; border:2px solid transparent; border-radius:14px; padding:3px; background:#fff; }
.icons input:checked + .ib{ border-color:var(--navy); box-shadow:0 0 0 3px rgba(31,34,80,.15); }
.icons input:focus-visible + .ib{ outline:2px solid var(--navy); }
.icons .ib svg{ width:100%; display:block; }
.icons .nm{ display:block; text-align:center; font-size:10.5px; color:var(--faint); margin-top:2px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.cats{ display:flex; gap:8px 16px; flex-wrap:wrap; }
.cats label{ display:flex; gap:6px; align-items:center; cursor:pointer; }
.acts{ display:flex; gap:10px; flex-wrap:wrap; align-items:center; }
.acts .sp{ flex:1; }


.ico img{ width:100%; height:100%; object-fit:cover; border-radius:14px; display:block; border:1px solid var(--border-strong); }
.pic{ display:flex; gap:16px; align-items:center; flex-wrap:wrap; }
.picbox{ width:160px; height:110px; border-radius:14px; border:1px dashed var(--border-strong); background:#fff; display:flex; align-items:center; justify-content:center; overflow:hidden; color:var(--faint); font-size:12.5px; text-align:center; padding:6px; }
.picbox img{ width:100%; height:100%; object-fit:cover; display:block; }
.cands{ display:grid; grid-template-columns:repeat(auto-fill,minmax(180px,1fr)); gap:12px; }
.cand{ background:#fff; border:1px solid var(--line); border-radius:12px; overflow:hidden; display:flex; flex-direction:column; }
.cand img{ width:100%; height:128px; object-fit:cover; display:block; background:var(--surface-2); }
.cand .ci{ padding:8px 10px; font-size:12px; color:var(--muted); flex:1; overflow-wrap:anywhere; }
.cand .ci b{ display:block; color:var(--ink); font-weight:500; }
.cand .ca{ padding:0 10px 10px; display:flex; gap:10px; align-items:center; }
.cand .ca a{ font-size:12px; }
.prog{ height:8px; background:var(--surface-2); border-radius:99px; overflow:hidden; }
.prog i{ display:block; height:100%; background:var(--navy); }
.rvhead{ display:flex; gap:14px; align-items:center; }
.rvhead .ico{ width:64px; height:64px; }
.pager{ display:flex; gap:6px; align-items:center; justify-content:center; flex-wrap:wrap; margin:18px 0 6px; }
.pager button{ min-width:38px; height:38px; padding:0 12px; border:1px solid var(--line); background:#fff; border-radius:10px; cursor:pointer; font-weight:600; }
.pager button.on{ background:var(--navy); color:#fff; border-color:var(--navy); }
.pager button:disabled{ opacity:.4; cursor:default; }
.pager .dots{ color:var(--faint); padding:0 4px; }
.pinfo{ text-align:center; color:var(--muted); font-size:13px; }
table{ width:100%; border-collapse:collapse; }
th,td{ text-align:left; padding:10px 12px; border-bottom:1px solid var(--line); font-size:14px; vertical-align:top; }
th{ font-size:12px; text-transform:uppercase; letter-spacing:.05em; color:var(--faint); }
.tablewrap{ overflow-x:auto; background:var(--card); border:1px solid var(--line); border-radius:16px; }
.stats{ display:grid; grid-template-columns:repeat(auto-fit,minmax(170px,1fr)); gap:12px; margin-bottom:16px; }
.stat{ background:var(--card); border:1px solid var(--line); border-radius:16px; padding:14px 16px; }
.stat b{ display:block; font:700 26px var(--font-display); }
.stat span{ color:var(--muted); font-size:13px; }
.catrow{ display:grid; grid-template-columns:1.1fr 1fr 1fr auto; gap:10px; align-items:end; padding:14px 0; border-bottom:1px solid var(--line); }
.catrow:last-child{ border-bottom:0; }
@media (max-width:720px){ .catrow{ grid-template-columns:1fr; } }
#toast{ position:fixed; left:50%; bottom:24px; transform:translateX(-50%); background:var(--navy); color:#fff; padding:11px 18px; border-radius:999px; font-weight:600; font-size:14px; opacity:0; pointer-events:none; transition:opacity .2s; z-index:50; max-width:90vw; }
#toast.on{ opacity:1; }
#toast.err{ background:var(--bad); }
</style>
</head>
<body>
<div id="app"></div>
<div id="toast" role="status"></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script>
const SIGHTS = [
  { id:'garni', region:'Kotayk', corridor:'east', icon:'temple', name:{en:'Garni Temple'}, lat:40.1064, lon:44.7300,
    cat:['fortress'], visitMin:60, roadFactor:1.25, speed:55,
    why:{en:"Armenia's only standing Greco-Roman colonnaded temple, perched over a gorge — the one clearly classical building in a country of medieval stone churches."},
    hours:{en:"Grounds open roughly 9:00–19:00"}, hoursFlagged:true, price:{en:"Small entry fee"}, priceFlagged:true },

  { id:'geghard', region:'Kotayk', corridor:'east', icon:'cliffMonastery', name:{en:'Geghard Monastery'}, lat:40.1439, lon:44.8151,
    cat:['church'], visitMin:60, roadFactor:1.25, speed:55,
    why:{en:"A UNESCO monastery with chapels carved directly into the cliff face — some rooms are literally hewn from the mountain, not built on it."},
    hours:{en:"Typically open dawn–dusk"}, hoursFlagged:true, price:{en:"Free, donations welcome"}, priceFlagged:false },

  { id:'garnigorge', region:'Kotayk', corridor:'east', icon:'gorge', name:{en:'Symphony of the Stones'}, lat:40.0975, lon:44.7167,
    cat:['nature'], visitMin:30, roadFactor:1.3, speed:45,
    why:{en:"A short walk down into Garni Gorge to a wall of hexagonal basalt columns, cooled into place by an ancient lava flow."},
    hours:{en:"Accessible dawn–dusk, no gate"}, hoursFlagged:true, price:{en:"Free"}, priceFlagged:false },

  { id:'khorvirap', region:'Ararat', corridor:'south', icon:'domeChurch', name:{en:'Khor Virap Monastery'}, lat:39.8791, lon:44.5701,
    cat:['church'], visitMin:45, roadFactor:1.2, speed:60,
    why:{en:"The closest, clearest view of Mount Ararat from Armenian soil, over the pit where Gregory the Illuminator was reportedly imprisoned before converting the kingdom."},
    hours:{en:"Typically open 9:00–18:00"}, hoursFlagged:true, price:{en:"Free, small pit-descent fee"}, priceFlagged:true },

  { id:'etchmiadzin', region:'Armavir', corridor:'west', icon:'domeChurch', name:{en:'Etchmiadzin Cathedral'}, lat:40.1608, lon:44.2925,
    cat:['church'], visitMin:60, roadFactor:1.15, speed:55,
    why:{en:"The seat of the Armenian Apostolic Church and, by most accounts, among the oldest cathedrals in the world — still an active place of worship."},
    hours:{en:"Grounds open roughly 8:00–20:00"}, hoursFlagged:true, price:{en:"Free"}, priceFlagged:false },

  { id:'zvartnots', region:'Armavir', corridor:'west', icon:'ruins', name:{en:'Zvartnots Cathedral (ruins)'}, lat:40.1594, lon:44.3536,
    cat:['church'], visitMin:30, roadFactor:1.15, speed:55,
    why:{en:"The circular footprint of a 7th-century cathedral that collapsed centuries ago — its scale is easier to read from the ruins than most standing buildings nearby."},
    hours:{en:"Typically open 10:00–17:00"}, hoursFlagged:true, price:{en:"Small entry fee"}, priceFlagged:true },


  { id:'sevanavank', region:'Gegharkunik', corridor:'northeast', icon:'domeChurch', name:{en:'Sevanavank, Lake Sevan'}, lat:40.5691, lon:44.9391,
    cat:['church'], visitMin:75, roadFactor:1.15, speed:65,
    why:{en:"A 9th-century monastery on a peninsula overlooking one of the highest large lakes in the world — the water alone justifies the drive."},
    hours:{en:"Grounds open dawn–dusk"}, hoursFlagged:true, price:{en:"Free"}, priceFlagged:false },

  { id:'dilijan', region:'Tavush', corridor:'northeast', icon:'town', name:{en:'Dilijan old town & forest'}, lat:40.7431, lon:44.8654,
    cat:['nature'], visitMin:120, roadFactor:1.35, speed:50,
    why:{en:"Forested hills, timber-balcony houses and mineral-water springs — the town Armenians nickname \"little Switzerland,\" and it's easy to see why on arrival."},
    hours:{en:"Town is open access; trails best in daylight"}, hoursFlagged:false, price:{en:"Free to walk the old town"}, priceFlagged:false },

  { id:'amberd', region:'Aragatsotn', corridor:'northwest', icon:'fortress', name:{en:'Amberd Fortress'}, lat:40.4067, lon:44.2306,
    cat:['fortress'], visitMin:60, roadFactor:1.4, speed:45,
    why:{en:"A 7th-century fortress wedged onto a cliff at 2,300m on Mount Aragats' slopes, with a small church and views down two river gorges at once."},
    hours:{en:"Open dawn–dusk"}, hoursFlagged:true, price:{en:"Small entry fee"}, priceFlagged:true,
    closedMonths:[10,11,0,1,2,3] /* Nov(10)-Apr(3): mountain road often snow/ice affected */ },

  { id:'karilake', region:'Aragatsotn', corridor:'northwest', icon:'lake', name:{en:'Kari Lake, Mt Aragats'}, lat:40.5378, lon:44.1897,
    cat:['waterfall'], visitMin:60, roadFactor:1.5, speed:40,
    why:{en:"A stark alpine lake at roughly 3,200m below Aragats' four summits — the road up feels like leaving Armenia's climate entirely."},
    hours:{en:"Seasonal — road generally closed by snow"}, hoursFlagged:true, price:{en:"Free"}, priceFlagged:false,
    closedMonths:[9,10,11,0,1,2,3,4] /* Oct-May: snow closure, real and material to routing */ },


  { id:'saghmosavank', region:'Aragatsotn', corridor:'northwest', icon:'domeChurch', name:{en:'Saghmosavank, Kasagh Gorge'}, lat:40.3242, lon:44.3346,
    cat:['church'], visitMin:45, roadFactor:1.25, speed:50,
    why:{en:"A 13th-century monastery balanced right at the lip of a sheer gorge — the drop below the back wall is most of the view."},
    hours:{en:"Open dawn–dusk"}, hoursFlagged:true, price:{en:"Free"}, priceFlagged:false },

  { id:'charentsarch', region:'Kotayk', corridor:'east', icon:'arch', name:{en:"Charents Arch viewpoint"}, lat:40.1467, lon:44.6467,
    cat:['view'], visitMin:15, roadFactor:1.2, speed:55,
    why:{en:"A roadside stone arch framing Mount Ararat across the valley — the single most-photographed pull-off on the road to Garni, and a genuinely good five-minute stop."},
    hours:{en:"Always accessible"}, hoursFlagged:false, price:{en:"Free"}, priceFlagged:false },

  { id:'noravank', region:'Vayots Dzor', corridor:'south', icon:'cliffMonastery', name:{en:'Noravank Monastery'}, lat:39.6852, lon:45.2306,
    cat:['church'], visitMin:60, roadFactor:1.3, speed:55,
    why:{en:"A 13th-century monastery set against sheer red-rock cliffs in Vayots Dzor — the drive in through the canyon is as memorable as the buildings."},
    hours:{en:"Open dawn–dusk"}, hoursFlagged:true, price:{en:"Small entry fee"}, priceFlagged:true },
  { id:'havutstar', region:'Kotayk', corridor:'east', icon:'cliffMonastery', name:{en:'Havuts Tar (ruins)'}, lat:40.1213, lon:44.7364,
    cat:['church'], visitMin:40, roadFactor:1.35, speed:45,
    why:{en:"A ruined cliffside monastery above Garni Gorge, reached by a short hike — quieter and less restored than Geghard, with the same gorge views."},
    hours:{en:"No gate, accessible in daylight"}, hoursFlagged:false, price:{en:"Free"}, priceFlagged:false },

  { id:'khosrovreserve', region:'Ararat', corridor:'east', icon:'gorge', name:{en:'Khosrov Forest Reserve'}, lat:40.0550, lon:44.7850,
    cat:['nature'], visitMin:90, roadFactor:1.3, speed:45,
    why:{en:"One of Armenia's oldest protected forests, said to have been planted by a 4th-century king to reforest the Ararat plain — gorge trails and juniper woodland, far fewer visitors than Garni next door."},
    hours:{en:"Entry generally needs a permit"}, hoursFlagged:true, price:{en:"Entry/permit fee"}, priceFlagged:true },

  { id:'areniCave', region:'Vayots Dzor', corridor:'south', icon:'cave', name:{en:'Areni-1 Cave'}, lat:39.7167, lon:45.1937,
    cat:['nature'], visitMin:45, roadFactor:1.2, speed:60,
    why:{en:"The cave where archaeologists found the world's oldest known leather shoe and winery, both over 5,500 years old — a short stop right off the road to Noravank."},
    hours:{en:"Typically open by day, hours vary"}, hoursFlagged:true, price:{en:"Small entry fee"}, priceFlagged:true },

  { id:'gndevank', region:'Vayots Dzor', corridor:'south', icon:'domeChurch', name:{en:'Gndevank Monastery'}, lat:39.7667, lon:45.3670,
    cat:['church'], visitMin:40, roadFactor:1.25, speed:55,
    why:{en:"A 10th-century monastery in a narrow Vayots Dzor gorge, built by a princess in memory of her husband — smaller and quieter than Noravank, on the same road."},
    hours:{en:"Open dawn–dusk"}, hoursFlagged:true, price:{en:"Free"}, priceFlagged:false },


  { id:'tatev', region:'Syunik', corridor:'south', icon:'cliffMonastery', name:{en:'Tatev Monastery'}, lat:39.3800, lon:46.2483,
    cat:['church'], visitMin:90, roadFactor:1.3, speed:55,
    why:{en:"A 9th-century monastery on a plateau above the Vorotan gorge, reached by the Wings of Tatev cable car — one of the longest reversible aerial tramways in the world."},
    hours:{en:"Cable car and grounds keep set hours"}, hoursFlagged:true, price:{en:"Cable car ticket + small monastery fee"}, priceFlagged:true },

  { id:'talin', region:'Aragatsotn', corridor:'west', icon:'ruins', name:{en:'Talin Cathedral (ruins)'}, lat:40.3833, lon:43.8667,
    cat:['church'], visitMin:30, roadFactor:1.2, speed:60,
    why:{en:"A ruined 7th-century cathedral on the way to Gyumri — once one of the largest domed churches in Armenia, now roofless but still imposing."},
    hours:{en:"Open access, daylight hours"}, hoursFlagged:false, price:{en:"Free"}, priceFlagged:false },


  { id:'harichavank', region:'Aragatsotn', corridor:'west', icon:'domeChurch', name:{en:'Harichavank Monastery'}, lat:40.6167, lon:43.9667,
    cat:['church'], visitMin:45, roadFactor:1.25, speed:55,
    why:{en:"A monastery complex near Artik combining a 7th-century church with a 13th-century one built beside it — a rare chance to compare two very different centuries of Armenian church architecture side by side."},
    hours:{en:"Open dawn–dusk"}, hoursFlagged:true, price:{en:"Free"}, priceFlagged:false },

  { id:'karmravor', region:'Aragatsotn', corridor:'northwest', icon:'domeChurch', name:{en:'Karmravor Church'}, lat:40.2986, lon:44.3592,
    cat:['church'], visitMin:20, roadFactor:1.1, speed:55,
    why:{en:"A tiny 7th-century church in Ashtarak, barely large enough for a handful of people — one of the few Armenian churches from this period that has never needed rebuilding."},
    hours:{en:"Open dawn–dusk"}, hoursFlagged:true, price:{en:"Free"}, priceFlagged:false },

  { id:'aruchavank', region:'Aragatsotn', corridor:'northwest', icon:'ruins', name:{en:'Aruchavank Cathedral'}, lat:40.3350, lon:44.2350,
    cat:['church'], visitMin:30, roadFactor:1.2, speed:55,
    why:{en:"A large 7th-century domed cathedral in Aruch village, with faded frescoes still visible inside — usually far quieter than the better-known churches nearer Yerevan."},
    hours:{en:"Open dawn–dusk"}, hoursFlagged:true, price:{en:"Free"}, priceFlagged:false },

  { id:'tegher', region:'Aragatsotn', corridor:'northwest', icon:'domeChurch', name:{en:'Tegher Monastery'}, lat:40.3944, lon:44.2167,
    cat:['church'], visitMin:30, roadFactor:1.3, speed:50,
    why:{en:"A 13th-century monastery on Aragats' lower slopes, built by the same royal family as Harichavank — a quiet stop with views back down toward Ashtarak on the way up to Byurakan."},
    hours:{en:"Open dawn–dusk"}, hoursFlagged:true, price:{en:"Free"}, priceFlagged:false },

  { id:'hayravank', region:'Gegharkunik', corridor:'northeast', icon:'domeChurch', name:{en:'Hayravank Monastery'}, lat:40.3800, lon:45.0100,
    cat:['church'], visitMin:30, roadFactor:1.2, speed:55,
    why:{en:"A small 9th-century monastery on a rocky outcrop over Lake Sevan's western shore — fewer crowds than Sevanavank, with a similar view of the water."},
    hours:{en:"Open dawn–dusk"}, hoursFlagged:true, price:{en:"Free"}, priceFlagged:false },

  { id:'haghartsin', region:'Tavush', corridor:'northeast', icon:'domeChurch', name:{en:'Haghartsin Monastery'}, lat:40.7647, lon:44.9508,
    cat:['church'], visitMin:50, roadFactor:1.35, speed:50,
    why:{en:"A monastery complex tucked into forested hills near Dilijan, with three churches built across three different centuries — restored in recent years with support from the ruling family of Sharjah."},
    hours:{en:"Open dawn–dusk"}, hoursFlagged:true, price:{en:"Free"}, priceFlagged:false },

  { id:'goshavank', region:'Tavush', corridor:'northeast', icon:'domeChurch', name:{en:'Goshavank Monastery'}, lat:40.7961, lon:44.9297,
    cat:['church'], visitMin:40, roadFactor:1.35, speed:50,
    why:{en:"A 12th-century monastery named for the medieval scholar-monk who founded it and wrote one of Armenia's earliest law codes here — known for some of the finest carved khachkars in the country."},
    hours:{en:"Open dawn–dusk"}, hoursFlagged:true, price:{en:"Free"}, priceFlagged:false },

  { id:'loriberd', region:'Lori', corridor:'north', icon:'fortress', name:{en:'Lori Berd Fortress'}, lat:41.0167, lon:44.3667,
    cat:['fortress'], visitMin:40, roadFactor:1.25, speed:60,
    why:{en:"An 11th-century fortress on a promontory surrounded on three sides by river gorges — the natural defenses did most of the work, which is why so much of the wall still stands."},
    hours:{en:"Open access, daylight hours"}, hoursFlagged:false, price:{en:"Free"}, priceFlagged:false },

  { id:'odzun', region:'Lori', corridor:'north', icon:'domeChurch', name:{en:'Odzun Church'}, lat:41.0500, lon:44.6000,
    cat:['church'], visitMin:30, roadFactor:1.3, speed:55,
    why:{en:"A large 6th-century basilica on a plateau above the Debed Canyon, with an unusual two-tier arcaded gallery running around its exterior."},
    hours:{en:"Open dawn–dusk"}, hoursFlagged:true, price:{en:"Free"}, priceFlagged:false },

  { id:'sanahin', region:'Lori', corridor:'north', icon:'domeChurch', name:{en:'Sanahin Monastery'}, lat:41.1206, lon:44.6394,
    cat:['church'], visitMin:50, roadFactor:1.3, speed:55,

դարյան ջրամբարով և գաղտնի անցման մասին ավանդությամբ։"], "smbataberd": ["Սմբատաբերդ ամրոց", "Վայոց ձորի խոշորագույն միջնադարյան ամրոցներից մեկը՝ երկու կիրճերի միջև ժայռային գագաթին. Արտաբույնք գյուղից հաշվեք մոտ մեկ ժամվա վերելք, իսկ Ծախաց Քար վանքը մոտ է։"], "jermuk": ["Ջերմուկի ջրվեժ", "Մոտ 70 մ բարձրությամբ ջրվեժ, որ ընկնում է Արփայի կիրճ՝ Ջերմուկ լեռնային առողջարանային քաղաքի ներսում, կոչվում է «Ջրահարսի վարսեր»։ Ավելացրեք զբոսանք քաղաքի հանքային աղբյուրներով։"], "shaki": ["Շակիի ջրվեժ", "18 մ բարձրությամբ ջրվեժ, որ թափվում է բազալտե լավայի եզրից Որոտանի կիրճում՝ Սիսիանի մոտ, փոքր գրոտներով շրջապատված։ Երևանից երկար ճանապարհ է, ուստի հարմար է ամբողջ օրվա ուղևորության համար։"], "trchkan": ["Տրչկանի ջրվեժ", "Հայաստանի ամենաբարձր ջրվեժը՝ մոտ 23 մ, Շիրակի և Լոռու սահմանին, կոչվում է իր վրայով ցատկող իշխանի անունով։ Հասնում են Չիչխանի կիրճով՝ ճանապարհով և արշավով, ամենահոյակապն է մարտից հունիս։"], "kumayri": ["Գյումրիի հին թաղամաս (Կումայրի)", "Գյումրիի հին թաղամասը՝ 19-րդ դարի սև և վարդագույն տուֆե շենքերով։ Այստեղ ռուսական շրջանի քաղաքային տեսքը շատ ավելի է պահպանվել, քան Երևանում, թեև որոշ շենքեր դեռ կրում են 1988 թվականի երկրաշարժի հետքերը։"], "blackfort": ["Սև բերդ, Գյումրի", "19-րդ դարի հսկայական ռուսական ամրոց՝ մուգ բազալտից, Գյումրիի վերևի բլրի վրա, կառուցված կայսրության և օսմանյան սահմանը պահպանելու համար։"], "yotverk": ["Յոթ Վերք եկեղեցի, Գյումրի", "Գյումրիի «Յոթ Վերք» եկեղեցին կենտրոնական հրապարակում՝ 19-րդ դարի տուֆե եկեղեցի, որ ծանր վնասվել էր 1988 թվականի երկրաշարժից և հետո վերակառուցվել է։"], "amenaprkich": ["Ամենափրկիչ եկեղեցի, Գյումրի", "19-րդ դարի մեծ տուֆե եկեղեցի Գյումրիի գլխավոր հրապարակի մոտ, վնասվել է 1988 թվականի երկրաշարժից և հետո վերակառուցվել։"], "marmashen": ["Մարմաշենի վանք", "10–11-րդ դարերի վանք՝ վարդագույն և մուգ տուֆից, Գյումրիի մոտ՝ գետակիրճի վերևում, մեծ գլխավոր եկեղեցով և փոքր մատուռներով։"], "lakearpi": ["Արփի լիճ ազգային պարկ", "Բարձրադիր լեռնային լիճ և ճահճուտ Շիրակի սարահարթում, պահպանվում է որպես ազգային պարկ և հայտնի է չվող ջրային թռչուններով։"], "artikquarry": ["Արտիկի տուֆի քարհանքեր", "Արտիկի տուֆի բաց քարհանքեր՝ վարդագույն և սև հրաբխային քար, որ օգտագործվել է Հայաստանի բազմաթիվ եկեղեցիների և քաղաքային շենքերի համար։"], "hripsime": ["Հռիփսիմե եկեղեցի, Վաղարշապատ", "7-րդ դարի եկեղեցի՝ վաղ հայկական ճարտարապետության անսովոր մաքուր օրինակ, Էջմիածնի՝ ՅՈՒՆԵՍԿՕ-ի ցանկում ընդգրկված եկեղեցիների խմբի մաս։"], "gayane": ["Գայանե եկեղեցի, Վաղարշապատ", "7-րդ դարի եկեղեցի Էջմիածնի ճանապարհին, վերակառուցված 17-րդ դարում, տաճարի հետ նույն ՅՈՒՆԵՍԿՕ-ի ցանկում ընդգրկված խմբի մաս։"], "shoghakat": ["Շողակաթ եկեղեցի, Վաղարշապատ", "1694 թվականի փոքր գմբեթավոր եկեղեցի Էջմիածնի մոտ, կոչվում է լույսի ճառագայթի անունով, որը, ըստ ավանդության, նշել է նահատակների հանգստավայրը։"], "sardarapat": ["Սարդարապատի հուշահամալիր", "1918 թվականի Սարդարապատի ճակատամարտի հուշապարկ, որտեղ հայկական ուժերը կասեցրին օսմանյան առաջխաղացումը. կարմիր տուֆե զանգակատուն և թևավոր ցլերի մեծ արձաններ։"], "metsamor": ["Մեծամորի հնագիտական վայր", "Հայաստանի հնագույն և խոշորագույն բնակավայրերից մեկը՝ բնակեցված բրոնզի դարից և հետագայում ամրացված։"], "hovhannavank": ["Հովհաննավանք", "Միջնադարյան վանք Քասաղի կիրճի եզրին՝ Օհանավանի մոտ, մեծ գմբեթավոր եկեղեցով և ծածկված գավթով։"], "oshakan": ["Օշական, Մեսրոպ Մաշտոցի գերեզման", "Գյուղի եկեղեցին, կառուցված Մեսրոպ Մաշտոցի գերեզմանի վրա՝ այն վանականի, որ մոտ 405 թվականին ստեղծեց հայոց այբուբենը։"], "byurakan": ["Բյուրականի աստղադիտարան", "Բյուրականի աստղաֆիզիկական աստղադիտարանը, հիմնադրվել է 1946 թվականին Արագած լեռան լանջերին՝ խորհրդային շրջանի մեծ աստղադիտակներով և Արարատյան դաշտի լայն տեսարանով։"], "ashtarak": ["Աշտարակի կիրճ և Ծիրանավոր եկեղեցի", "Աշտարակի խորը Քասաղի կիրճի վրայով հին քարե կամուրջներ և կողքին՝ վաղմիջնադարյան փոքր Ծիրանավոր եկեղեցին։"], "mughni": ["Մուղնու վանք", "17-րդ դարի եկեղեցի Մուղնի գյուղում, Աշտարակից մի քանի րոպե հեռավորության վրա։"], "alphabet": ["Հայկական այբուբենի հուշարձան", "Հայկական այբուբենի հսկա քարե տառերի պարկ Արագած լեռան տակ գտնվող լանջին, ստեղծվել է 2005 թվականին՝ այբուբենի 1600-ամյակի առթիվ։"], "aparanres": ["Ապարանի ջրամբար", "Մեծ ջրամբար Քասաղ գետի վրա՝ Ապարանի մոտ, դեպի Արագած լեռ բացվող լեռնային տեսարաններով։"], "yeghvard": ["Եղվարդի Զորավոր եկեղեցի", "Փոքր միջնադարյան եկեղեցի Եղվարդ քաղաքում, արագ կանգառ Երևանից դեպի հյուսիս տանող ճանապարհին։"], "kecharis": ["Կեչառիսի վանք, Ծաղկաձոր", "Մի քանի եկեղեցիներից բաղկացած վանական համալիր, հիմնադրվել է 11-րդ դարում, Ծաղկաձորի վերևի անտառապատ լեռներում։"], "tsaghcable": ["Ծաղկաձորի ճոպանուղի", "Ճոպանուղի Ծաղկաձորից դեպի Թեղենիս լեռ՝ Կոտայքի բլուրների լայն տեսարաններով. ձմռանը նաև դահուկային հանգստավայր։"], "teghenyats": ["Տեղենյաց վանք", "Փոքր միջնադարյան վանք Կոտայքի մարզում, հանգիստ կանգառ հիմնական զբոսաշրջային երթուղիներից հեռու։"], "goght": ["Գողթ գյուղ", "Փոքր գյուղ Գառնիի և Գեղարդի միջև՝ միջնադարյան եկեղեցով և թարմ թխած լավաշ համտեսելու լավ վայր։"], "azat": ["Ազատի ջրամբար", "Ջրամբար Ազատ գետի վրա՝ Գառնիից հարավ գտնվող նախալեռներում, լեռնային տեսարաններով։"], "noratus": ["Նորատուսի խաչքարերի գերեզմանոց", "Հայաստանի ամենամեծ պահպանված միջնադարյան խաչքարերի դաշտը՝ տարածված լանջի գերեզմանոցում՝ Սևանա լճի մոտ։"], "lchashen": ["Լճաշենի ժայռապատկերներ և բրոնզեդարյան վայրեր", "Բրոնզի դարի ժայռապատկերների և թաղումների վայր Սևանա լճի ափին։"], "shorzha": ["Շորժայի լողափ, Սևանա լիճ", "Սևանա լճի արևմտյան ափի հատված՝ բաց լողափերով և ջրի վրայով բացվող տեսարաններով։"], "selim": ["Սելիմի քարավանատուն", "1332 թվականի բազալտե քարավանատուն Սելիմի (Վարդենյաց) լեռնանցքում՝ մոտ 2410 մ բարձրության վրա, Հայաստանի ամենալավ պահպանված քարավանատունը։"], "parz": ["Պարզ լիճ, Դիլիջան", "Փոքր անտառային լիճ Դիլիջանի ազգային պարկի տարածքում՝ շուրջը զբոսանքի արահետներով։"], "jukhtak": ["Ջուխտակ վանք", "11–12-րդ դարերի վանք Դիլիջանի ազգային պարկի անտառային բացատում՝ Դիլիջանից մոտ 3 կմ հյուսիս-արևմուտք։"], "matosavank": ["Մաթոսավանք", "13-րդ դարի փոքր վանք, թաքնված Դիլիջանի ազգային պարկի անտառում՝ Ջուխտակ վանքի մոտ։ Եկեղեցին մասամբ ավերված է, իսկ արահետը կարող է դժվար հետևելի լինել։"], "makaravank": ["Մա /* ---------- finding free pictures on Wikimedia Commons ---------- */
const COMMONS = 'https://commons.wikimedia.org/w/api.php';
function plain(html){ const d = document.createElement('div'); d.innerHTML = String(html || ''); return (d.textContent || '').replace(/\s+/g, ' ').trim(); }
async function commonsSearch(q){
  const url = COMMONS + '?action=query&format=json&origin=*&generator=search&gsrnamespace=6&gsrlimit=24&gsrsearch=' + encodeURIComponent(q + ' filetype:bitmap')
    + '&prop=imageinfo&iiprop=url|extmetadata|size|mime&iiurlwidth=960&iiextmetadatafilter=LicenseShortName|Artist';
  const r = await fetch(url);
  if(!r.ok) throw new Error('commons ' + r.status);
  const d = await r.json();
  const pages = d.query && d.query.pages ? Object.values(d.query.pages) : [];
  pages.sort((a, b) => (a.index || 0) - (b.index || 0));
  const out = [];
  for(const pg of pages){
    const ii = pg.imageinfo && pg.imageinfo[0]; if(!ii) continue;
    if(!/^image\/(jpeg|png)$/.test(ii.mime || '')) continue;
    if((ii.width || 0) < 900) continue;
    const title = String(pg.title || '').replace(/^File:/, '');
    if(/\b(map|maps|logo|flag|coat of arms|diagram|plan|stamp|locator|banknote|coin|poster|scan|panorama of)\b/i.test(title)) continue;
    const m = ii.extmetadata || {};
    const lic = plain(m.LicenseShortName && m.LicenseShortName.value);
    if(!/^(CC[ -]?BY|CC0|Public domain|PD)/i.test(lic) || /\b(NC|ND)\b/i.test(lic)) continue;   // only licences that allow reuse on a website
    const author = (plain(m.Artist && m.Artist.value) || 'Unknown author').slice(0, 110);
    out.push({ title, thumb: ii.thumburl || ii.url, license: lic, author, source: ii.descriptionurl });
    if(out.length >= 9) break;
  }
  return out;
}
const credOf = c => (c.author + ' · ' + c.license + ' · Wikimedia Commons').slice(0, 300);
async function candidateBlob(c){
  const r = await fetch(c.thumb); if(!r.ok) throw new Error('image ' + r.status);
  return resizeImage(await r.blob(), 1600);
}
function candsHtml(cands, action){
  if(!cands.length) return '<div class="hint">No free-to-use photos found for that search. Try other words, for example the local name, or skip this place.</div>';
  return '<div class="cands">' + cands.map((c, i) => `<div class="cand"><img src="${esc(c.thumb)}" alt="${esc(c.title)}" loading="lazy" referrerpolicy="no-referrer"><div class="ci"><b>${esc(c.author)}</b>${esc(c.license)}</div><div class="ca"><button class="btn small primary" ${S.rv.saving !== -1 ? 'disabled' : ''} onclick="${action}(${i})">Use this</button><a href="${esc(c.source)}" target="_blank" rel="noopener">Details</a></div></div>`).join('') + '</div>';
}
function defaultQuery(id){ const e = eff(SIGHTS.find(x => x.id === id)); return e.name.en.replace(/\s*\(.*?\)\s*/g, ' ').trim() + ' Armenia'; }

    <div class="rvhead"><div class="ico">${iconSvg(cur.icon)}</div><div style="flex:1;min-width:0"><div class="pname">${esc(cur.name.en)}</div><div class="pmeta">${esc(cur.name.hy)} · ${esc(cur.region || '')}</div></div><button class="btn small" ${rv.saving !== -1 ? 'disabled' : ''} onclick="rvSkip()">Skip for now</button></div>
    <div class="row2" style="margin:14px 0"><input class="input" id="rv-q" value="${esc(rv.q)}" onkeydown="if(event.key==='Enter')rvResearch()"><button class="btn" onclick="rvResearch()">Search</button></div>
    <div id="rv-body">${rv.busy ? '<div class="hint">Searching…</div>' : rv.err ? `<div class="msg err">${esc(rv.err)} <button class="btn small" onclick="rvResearch()">Try again</button></div>` : candsHtml(rv.cands || [], 'rvApprove')}</div>
    <div class="hint" style="margin-top:12px">Photos from Wikimedia Commons, free to use with credit. Check that the photo really shows this place, then press “Use this”.</div>
  </div>`;
}
function rvResearch(){ const v = ($('rv-q').value || '').trim(); if(!v) return; S.rv.q = v; S.rv.busy = true; renderPictures(); rvSearch(); }
async function rvSearch(){
  const forId = S.rv.loadedFor, q = S.rv.q;
  try{ const c = await commonsSearch(q); if(S.rv.loadedFor !== forId) return; S.rv.cands = c; S.rv.err = ''; }
  catch(e){ console.error(e); if(S.rv.loadedFor !== forId) return; S.rv.cands = null; S.rv.err = 'Could not reach Wikimedia.'; }
  S.rv.busy = false; if(S.tab === 'pictures') renderPictures();
}
function rvSkip(){ const cur = rvQueue()[0]; if(!cur) return; S.rv.skipped.add(cur.id); S.rv.loadedFor = null; renderPictures(); }
async function rvApprove(i){
  const rv = S.rv, c = rv.cands && rv.cands[i], id = rv.loadedFor; if(!c || !id || rv.saving !== -1) return;
  rv.saving = i; renderPictures(); toast('Saving the picture…');
  let uploaded = null;
  try{
    const blob = await candidateBlob(c);
    const path = id + '/' + Date.now() + '.jpg';
    const up = await sb.storage.from(PIC_BUCKET).upload(path, blob, { contentType:'image/jpeg', upsert:false });
    if(up.error) throw up.error;
    uploaded = path;
    const f = currentFields(id), old = f.photo_url;
    f.photo_url = sb.storage.from(PIC_BUCKET).getPublicUrl(path).data.publicUrl; f.photo_credit = credOf(c); f.photo_source = c.source;
    await writeOverride(id, f);
    if(old) dropOldPicture(old);
    rv.loadedFor = null; toast('Picture saved.');
  }catch(e){
    console.error(e);
    if(uploaded){ try{ await sb.storage.from(PIC_BUCKET).remove([uploaded]); }catch(x){} }
    toast('Could not save that picture. Try another one.', true);
  }
  rv.saving = -1; renderPictures();
}

/* ---------- pictures ---------- */
function clearPend(){ if(S.pend && S.pend.url) URL.revokeObjectURL(S.pend.url); S.pend = null; S.ed = null; }
function picBoxHtml(e){
  const p = S.pend;
  if(p && p.id === e.id){
    if(p.remove) return 'No picture';
    if(p.url) return '<img src="' + esc(p.url) + '" alt="New picture">';
  }
  if(e.photo) return '<img src="' + esc(e.photo) + '" alt="Current picture">';
  return 'No picture yet<br>(the icon is shown)';
}
function refreshPic(id){
  const e = eff(SIGHTS.find(x => x.id === id));
  const box = $('picbox'); if(box) box.innerHTML = picBoxHtml(e);
  const has = S.pend && S.pend.id === id ? !S.pend.remove : !!e.photo;
  const rm = $('pic-remove'); if(rm) rm.hidden = !has;
}
function resizeImage(file, maxSide){
  return new Promise((resolve, reject) => {
    const url = URL.createObjectURL(file), img = new Image();
    img.onload = () => {
      const k = Math.min(1, maxSide / Math.max(img.width, img.height));
      const c = document.createElement('canvas'); c.width = Math.max(1, Math.round(img.width * k)); c.height = Math.max(1, Math.round(img.height * k));
      const x = c.getContext('2d'); x.fillStyle = '#fff'; x.fillRect(0, 0, c.width, c.height); x.drawImage(img, 0, 0, c.width, c.height);
      URL.revokeObjectURL(url);
      c.toBlob(b => b ? resolve(b) : reject(new Error('resize failed')), 'image/jpeg', 0.86);
    };
    img.onerror = () => { URL.revokeObjectURL(url); reject(new Error('not an image')); };
    img.src = url;
  });
}
async function pickPic(){
  const id = S.openId, inp = $('pic-file'), f = inp && inp.files && inp.files[0];
  if(!id || !f) return;
  if(!/^image\/(jpeg|png|webp)$/.test(f.type)){ toast('Please choose a JPG, PNG or WebP picture.', true); inp.value = ''; return; }
  if(f.size > 20 * 1024 * 1024){ toast('That picture is too large (over 20 MB).', true); inp.value = ''; return; }
  try{
    const blob = await resizeImage(f, 1600);
    clearPend(); S.pend = { id, blob, url:URL.createObjectURL(blob), remove:false, credit:null, source:null };
    refreshPic(id);
  }catch(e){ console.error(e); toast('Could not read that picture.', true); }
  inp.value = '';
}
function removePic(){
  const id = S.openId; if(!id) return;
  clearPend(); S.pend = { id, blob:null, url:null, remove:true }; refreshPic(id);
}
function picPathFromUrl(u){ const k = '/object/public/' + PIC_BUCKET + '/'; const i = String(u || '').indexOf(k); return i === -1 ? null : decodeURIComponent(u.slice(i + k.length)); }
async function dropOldPicture(url){ const path = picPathFromUrl(url); if(path){ try{ await sb.storage.from(PIC_BUCKET).remove([path]); }catch(e){ console.warn(e); } } }

async function writeOverride(id, f){
  const empty = !f.hidden && f.name_en == null && f.name_hy == null && f.why_en == null && f.why_hy == null && f.icon == null && f.cats == null && f.photo_url == null;
  if(empty){
    const { error } = await sb.from('sight_overrides').delete().eq('sight_id', id);
    if(error) throw error;
    delete S.ov[id];
  }else{
    const row = Object.assign({ sight_id:id, updated_at:new Date().toISOString() }, f);
    const { data, error } = await sb.from('sight_overrides').upsert(row, { onConflict:'sight_id' }).select().single();
    if(error) throw error;
    S.ov[id] = data;
  }
}
function currentFields(id){ const o = S.ov[id] || {}; return { hidden:!!o.hidden, name_en:o.name_en ?? null, name_hy:o.name_hy ?? null, why_en:o.why_en ?? null, why_hy:o.why_hy ?? null, icon:o.icon ?? null, cats:o.cats ?? null, photo_url:o.photo_url ?? null, photo_credit:o.photo_credit ?? null, photo_source:o.photo_source ?? null }; }

async function savePlace(id){
  const base = SIGHTS.find(x => x.id === id);
  const v = k => ($(k).value || '').trim();
  const f = currentFields(id);
  const pick = (val, orig) => (val && val !== orig) ? val : null;
  f.name_en = pick(v('f-name-en'), base.name.en);
  f.name_hy = pick(v('f-name-hy'), base.name.hy);
  f.why_en = pick(v('f-why-en'), base.why.en);
  f.why_hy = pick(v('f-why-hy'), base.why.hy);
  const ic = document.querySelector('input[name="f-icon"]:checked');
  f.icon = (ic && ic.value !== base.icon) ? ic.value : null;
  const cats = Array.from(document.querySelectorAll('input[name="f-cat"]:checked')).map(x => x.value);
  if(!cats.length){ toast('Pick at least one category.', true); return; }
  f.cats = (cats.slice().sort().join() === base.cat.slice().sort().join()) ? null : cats;
  const oldPhoto = f.photo_url; let uploaded = null;
  try{
    const pd = (S.pend && S.pend.id === id) ? S.pend : null;
    if(pd && pd.blob){
      const path = id + '/' + Date.now() + '.jpg';
      const up = await sb.storage.from(PIC_BUCKET).upload(path, pd.blob, { contentType:'image/jpeg', upsert:false });
      if(up.error) throw up.error;
      uploaded = path;
      f.photo_url = sb.storage.from(PIC_BUCKET).getPublicUrl(path).data.publicUrl;
      f.photo_credit = pd.credit || null; f.photo_source = pd.source || null;
    }else if(pd && pd.remove){ f.photo_url = null; f.photo_credit = null; f.photo_source = null; }
    await writeOverride(id, f);
    if(oldPhoto && oldPhoto !== f.photo_url) dropOldPicture(oldPhoto);
    clearPend(); S.openId = null; renderList(); toast('Saved. The site will show it shortly.');
  }catch(e){
    console.error(e);
    if(uploaded){ try{ await sb.storage.from(PIC_BUCKET).remove([uploaded]); }catch(x){} }
    toast('Could not save. Please try again.', true);
  }
}
async function resetPlace(id){
  if(!confirm('Undo all edits to this place and bring back the original?')) return;
  const oldPhoto = (S.ov[id] || {}).photo_url;
  try{ await writeOverride(id, { hidden:false, name_en:null, name_hy:null, why_en:null, why_hy:null, icon:null, cats:null, photo_url:null, photo_credit:null, photo_source:null }); if(oldPhoto) dropOldPicture(oldPhoto); clearPend(); S.openId = null; renderList(); toast('Back to the original.'); }
  catch(e){ console.error(e); toast('Could not save. Please try again.', true); }
}
async function quickHide(id){
  const f = currentFields(id); const e = eff(SIGHTS.find(x => x.id === id));
  if(!f.hidden && !confirm('Remove "' + e.name.en + '" from the site? You can bring it back at any time.')) return;
  f.hidden = !f.hidden;
  try{ await writeOverride(id, f); renderList(); toast(f.hidden ? 'Removed from the site.' : 'It is back on the site.'); }
  catch(err){ console.error(err); toast('Could not save. Please try again.', true); }
}

/* ---------- CATEGORIES ---------- */
function renderCats(){
  const used = {}; SIGHTS.map(eff).forEach(e => e.cat.forEach(c => used[c] = (used[c]||0) + 1));
  $('pane').innerHTML = `<div class="card">
    <p style="margin-top:0;color:var(--muted)">Rename the interest buttons on the site. Leave a box empty to use the original name.</p>
    ${Object.keys(CATEGORIES).map(c => `<div class="catrow">
      <div><b>${esc(CATEGORIES[c].en)}</b><div class="hint">${used[c]||0} places</div></div>
      <div><label class="lbl" for="ce-${c}">English</label><input class="input" id="ce-${c}" maxlength="80" value="${esc((S.catOv[c]||{}).name_en || '')}" placeholder="${esc(CATEGORIES[c].en)}"></div>
      <div><label class="lbl" for="ch-${c}">Armenian</label><input class="input" id="ch-${c}" maxlength="80" value="${esc((S.catOv[c]||{}).name_hy || '')}" placeholder="${esc(CATEGORIES[c].hy)}"></div>
      <button class="btn primary" onclick="saveCat('${c}')">Save</button>
    </div>`).join('')}
  </div>`;
}
async function saveCat(c){
  const en = ($('ce-' + c).value || '').trim(), hy = ($('ch-' + c).value || '').trim();
  const nEn = (en && en !== CATEGORIES[c].en) ? en : null, nHy = (hy && hy !== CATEGORIES[c].hy) ? hy : null;
  try{
    if(nEn == null && nHy == null){
      const { error } = await sb.from('category_overrides').delete().eq('cat_id', c); if(error) throw error; delete S.catOv[c];
    }else{
      const { data, error } = await sb.from('category_overrides').upsert({ cat_id:c, name_en:nEn, name_hy:nHy, updated_at:new Date().toISOString() }, { onConflict:'cat_id' }).select().single();
      if(error) throw error; S.catOv[c] = data;
    }
    toast('Saved. The site will show it shortly.');
  }catch(e){ console.error(e); toast('Could not save. Please try again.', true); }
}

/* ---------- PEOPLE ---------- */
async function renderPeople(){
  $('pane').innerHTML = '<div class="card">Loading people…</div>';
  if(!S.users){
    const { data, error } = await sb.rpc('admin_list_users');
    if(error){ S.usersErr = 'Could not load the list.'; } else { S.users = data || []; S.usersErr = ''; }
  }
  if(S.usersErr){ $('pane').innerHTML = '<div class="card">' + esc(S.usersErr) + ' <button class="btn small" onclick="S.users=null;renderPeople()">Try again</button></div>'; return; }
  const us = S.users, now = Date.now(), week = 7*24*3600*1000;
  const active = us.filter(u => u.last_sign_in_at && now - new Date(u.last_sign_in_at).getTime() < week).length;
  const withRev = us.filter(u => Number(u.reviews) > 0).length;
  $('pane').innerHTML = `
  <div class="stats">
    <div class="stat"><b>${us.length}</b><span>People with an account</span></div>
    <div class="stat"><b>${active}</b><span>Signed in the last 7 days</span></div>
    <div class="stat"><b>${withRev}</b><span>Have left a review</span></div>
  </div>
  <div class="tools">
    <input class="input" type="search" placeholder="Search by name or email…" value="${esc(S.uq)}" oninput="S.uq=this.value;renderUsers()">
    <button class="btn small" onclick="downloadUsers()">Download as spreadsheet (CSV)</button>
    <button class="btn small" onclick="S.users=null;renderPeople()">Refresh</button>
    <span class="count" id="ucount"></span>
  </div>
  <div class="tablewrap"><table><thead><tr><th>Person</th><th>Signed up with</th><th>Joined</th><th>Last sign-in</th><th>Reviews</th><th>Saved trips</th><th>Wish list</th></tr></thead><tbody id="ubody"></tbody></table></div>`;
  renderUsers();
}
const fmtDate = d => d ? new Date(d).toLocaleString(undefined, { dateStyle:'medium', timeStyle:'short' }) : '—';
const provName = p => p === 'google' ? 'Google' : (p === 'email' ? 'Email' : p);
function filteredUsers(){ const q = norm(S.uq).trim(); return (S.users||[]).filter(u => !q || norm((u.name||'') + ' ' + (u.email||'')).includes(q)); }
function renderUsers(){
  const rows = filteredUsers();
  $('ucount').textContent = rows.length + (rows.length === 1 ? ' person' : ' people');
  $('ubody').innerHTML = rows.length ? rows.map(u => `<tr>
    <td><b>${esc(u.name || '—')}</b><div class="pmeta">${esc(u.email || '')}</div></td>
    <td>${esc(provName(u.provider))}</td><td>${esc(fmtDate(u.created_at))}</td><td>${esc(fmtDate(u.last_sign_in_at))}</td>
    <td>${u.reviews}</td><td>${u.saved_trips}</td><td>${u.wishlist}</td></tr>`).join('') : '<tr><td colspan="7">Nobody matches.</td></tr>';
}
function downloadUsers(){
  const q = s => '"' + String(s == null ? '' : s).replace(/"/g, '""') + '"';
  const lines = [['Name','Email','Signed up with','Joined','Last sign-in','Reviews','Saved trips','Wish list'].map(q).join(',')];
  filteredUsers().forEach(u => lines.push([u.name, u.email, provName(u.provider), u.created_at, u.last_sign_in_at, u.reviews, u.saved_trips, u.wishlist].map(q).join(',')));
  const blob = new Blob(['\ufeff' + lines.join('\n')], { type:'text/csv;charset=utf-8' });
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = 'people.csv'; document.body.appendChild(a); a.click(); a.remove();
}
</script>
